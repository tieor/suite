<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
.cinema{position:fixed;left:0;right:0;height:18vh;background:#000c;pointer-events:none;opacity:0;transition:opacity .55s ease;z-index:2}

#notice{bottom:7%;padding:0 14px;line-height:2;border-radius:6px}#notice:empty{display:none}
#retry,#exit{bottom:2%;border:1px solid #d5dbe588;border-radius:6px;padding:7px 12px;cursor:pointer}#retry[hidden],#exit[hidden]{display:none}
.connection-error #notice{bottom:auto;top:36%;width:min(440px,88%);padding:12px}
.connection-error #retry{bottom:auto;top:55%}.connection-error #exit{bottom:auto;top:66%}
.reduced .cinema,.reduced .cg-wrap{transition-duration:.1s}
